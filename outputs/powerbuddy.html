<!doctype html>
<html lang="en" data-pb-version="2">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F6F2">
<meta name="description" content="PowerBuddy: see your household's electricity and water use, compare with similar homes, and work on it with friends. A GreenBuddies prototype.">
<title>PowerBuddy</title>
<style>/* PowerBuddy V2 */
:root{
  --page:#E9ECE6; --app:#F6F6F2; --surface:#FFFFFF; --sunken:#EFF1EC;
  --ink:#16211B; --ink-2:#3F4B44; --muted:#69746D; --faint:#97A09A; --line:#E2E5DF; --line-2:#D3D8D0;
  --brand:#1F4D3A; --brand-hover:#183D2E; --brand-soft:#E5EEE8; --brand-ink:#FFFFFF;
  --elec:#3F8A2E; --elec-soft:#EBF3E6; --water:#2F6CA3; --water-soft:#E5EEF6;
  --good:#2C7A4B; --good-soft:#E3F1E8; --warn:#9A5B0F; --warn-soft:#FAF0DF; --bad:#B0402B; --bad-soft:#F8E6E1;
  --gold:#B5852A;
  --r-lg:16px; --r:12px; --r-sm:8px;
  --shadow:0 1px 2px #16211B0D,0 2px 8px #16211B0A;
  --font:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--page);color:var(--ink);font:400 15px/1.45 var(--font);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1,"cv11" 1}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}

/* ---------- stage & phone ---------- */
.stage{min-height:100vh;display:grid;place-items:center;padding:24px}
.stage-label{position:fixed;top:18px;left:22px;display:flex;align-items:center;gap:10px;color:var(--ink-2)}
.stage-label .mark{width:28px;height:28px;color:var(--brand)}
.stage-label strong{display:block;font-size:15px;color:var(--ink)}
.stage-label span{font-size:12px;color:var(--muted)}
.phone{position:relative;width:390px;height:min(844px,calc(100vh - 48px));min-height:620px;background:var(--app);border-radius:46px;border:10px solid #1B2420;box-shadow:0 30px 60px -20px #16211B55,0 0 0 1px #0000000d;overflow:hidden;display:flex;flex-direction:column}
.statusbar{height:40px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 28px 0 30px;font-size:13px;font-weight:650}
.status-icons{display:flex;gap:4px;align-items:flex-end}
.status-icons i{display:block;width:4px;background:var(--ink);border-radius:1px}
.status-icons i:nth-child(1){height:6px}.status-icons i:nth-child(2){height:9px}.status-icons i:nth-child(3){height:12px}
.app{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}

@media(min-width:741px) and (max-width:980px){.stage-label{display:none}}
@media(max-width:740px){
  body{background:var(--app)}
  .stage{display:block;padding:0;min-height:100vh}
  .stage-label{position:static;height:44px;padding:0 60px 0 16px;gap:8px;border-bottom:1px solid var(--line);background:var(--surface)}
  .stage-label .mark{width:22px;height:22px}
  .stage-label strong{display:inline;font-size:13px}
  .stage-label span{font-size:11px;margin-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stage-label div{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .phone{width:100%;height:calc(100dvh - 44px);min-height:0;border:0;border-radius:0;box-shadow:none}
  .statusbar{display:none}
}

/* ---------- app chrome ---------- */
.top{flex:none;display:flex;align-items:center;gap:12px;padding:8px 16px 10px 20px;background:var(--app)}
.top-title{flex:1;min-width:0}
.top-title h1{font-size:17px;font-weight:650;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-title p{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{position:relative;width:40px;height:40px;flex:none;display:grid;place-items:center;border:0;border-radius:12px;background:transparent;color:var(--ink-2)}
.icon-btn:hover{background:var(--sunken)}
.icon-btn .count{position:absolute;top:5px;right:4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:700;line-height:17px;text-align:center;border:2px solid var(--app)}
.content{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px 20px 28px}
.content::-webkit-scrollbar{width:0}
.tabs{flex:none;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface);padding:6px 4px calc(10px + env(safe-area-inset-bottom))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 2px;border:0;background:none;color:var(--muted);font-size:11px;font-weight:550;min-height:48px}
.tab .i{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--brand)}
.tab[aria-current="page"] .i{stroke-width:2.2}

/* ---------- icons & avatars ---------- */
.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.i.sm{width:16px;height:16px}.i.xs{width:14px;height:14px}.i.lg{width:24px;height:24px}
.avatar{width:36px;height:36px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;letter-spacing:.02em}
.avatar.sm{width:28px;height:28px;font-size:11px}.avatar.lg{width:72px;height:72px;font-size:26px}
.avatar.me{background:var(--brand)}
.chip-icon{width:36px;height:36px;flex:none;border-radius:10px;display:grid;place-items:center;background:var(--sunken);color:var(--ink-2)}
.chip-icon.elec{background:var(--elec-soft);color:var(--elec)}.chip-icon.water{background:var(--water-soft);color:var(--water)}
.chip-icon.brand{background:var(--brand-soft);color:var(--brand)}.chip-icon.gold{background:#F6EEDC;color:var(--gold)}

/* ---------- type & blocks ---------- */
.section{margin-top:26px}
.section:first-child{margin-top:8px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.section-head h2{font-size:17px;font-weight:650;letter-spacing:-.01em}
.section-head .meta,.meta{font-size:13px;color:var(--muted)}
.link{border:0;background:none;padding:6px 0;color:var(--brand);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:4px}
.link:hover{text-decoration:underline}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:16px}
.card+.card{margin-top:10px}
.list{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;min-height:60px;width:100%;border:0;background:none;text-align:left}
.row+.row{border-top:1px solid var(--line)}
button.row:hover{background:#FAFAF8}
.row-main{flex:1;min-width:0}
.row-title{font-weight:600;font-size:15px;line-height:1.3}
.row-sub{font-size:13px;color:var(--muted);line-height:1.35;margin-top:1px}
.row-end{flex:none;text-align:right;font-size:14px}
.num{font-variant-numeric:tabular-nums}
.big-num{font-size:34px;font-weight:650;letter-spacing:-.02em;line-height:1.05}
.big-num small{font-size:15px;font-weight:550;color:var(--muted);letter-spacing:0;margin-left:3px}
.delta{display:inline-flex;align-items:center;gap:2px;font-size:13px;font-weight:650;white-space:nowrap}
.delta.good{color:var(--good)}.delta.bad{color:var(--bad)}.delta.flat{color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sunken);color:var(--ink-2);white-space:nowrap}
.tag.low{background:var(--good-soft);color:var(--good)}.tag.high{background:var(--bad-soft);color:var(--bad)}.tag.normal{background:var(--sunken);color:var(--ink-2)}
.tag.brand{background:var(--brand-soft);color:var(--brand)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.gold{background:#F6EEDC;color:#7B5814}
.pts{font-weight:650;color:var(--brand);white-space:nowrap}
.divider{height:1px;background:var(--line);margin:14px 0}

/* ---------- buttons & controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:var(--r);border:1px solid transparent;font-weight:600;font-size:15px;transition:background .12s,transform .12s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{background:var(--brand-hover)}
.btn.secondary{background:var(--surface);border-color:var(--line-2);color:var(--ink)}
.btn.secondary:hover{background:var(--sunken)}
.btn.ghost{background:transparent;color:var(--brand);padding-inline:10px}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn-row{display:flex;gap:8px;margin-top:14px}
.btn-row .btn{flex:1}
.seg{display:flex;padding:3px;border-radius:12px;background:var(--sunken);gap:2px}
.seg button{flex:1;min-height:36px;border:0;border-radius:9px;background:transparent;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px #16211B1A}
.seg.small button{min-height:30px;font-size:13px}
.field{display:block;margin-top:14px}
.field>span{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.input,.select{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);font-size:16px}
.input:focus,.select:focus{outline:2px solid var(--brand);outline-offset:0;border-color:var(--brand)}
.input-unit{position:relative}
.input-unit .input{padding-right:52px}
.input-unit b{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-weight:500;color:var(--muted);font-size:14px}
.field-error{display:block;margin-top:6px;color:var(--bad);font-size:13px;font-weight:550}
.input[aria-invalid="true"]{border-color:var(--bad)}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.stepper{display:flex;align-items:center;gap:0;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);width:max-content}
.stepper button{width:44px;height:44px;border:0;background:none;display:grid;place-items:center;color:var(--brand)}
.stepper button[disabled]{color:var(--faint)}
.stepper output{min-width:36px;text-align:center;font-weight:650;font-size:17px}
.range{width:100%;accent-color:var(--brand);height:28px}
.switch{position:relative;width:46px;height:28px;flex:none;border:0;border-radius:999px;background:var(--line-2);transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px #0003;transition:transform .15s var(--ease)}
.switch[aria-checked="true"]{background:var(--brand)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;min-height:88px;border:1.5px solid var(--line-2);border-radius:var(--r);background:var(--surface);text-align:left;font-weight:600;font-size:14px;line-height:1.25}
.choice .i{color:var(--ink-2)}
.choice small{font-weight:400;color:var(--muted);font-size:12px}
.choice[aria-pressed="true"],.choice[aria-checked="true"]{border-color:var(--brand);background:var(--brand-soft);box-shadow:inset 0 0 0 1px var(--brand)}
.choice[aria-pressed="true"] .i,.choice[aria-checked="true"] .i{color:var(--brand)}
.choice.wide{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center}
.check-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.check-list .choice{min-height:0;flex-direction:row;align-items:center;padding:12px}

/* ---------- progress ---------- */
.bar{position:relative;height:8px;border-radius:999px;background:var(--sunken);overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--brand);transition:width .6s var(--ease)}
.bar.elec>i{background:var(--elec)}.bar.water>i{background:var(--water)}.bar.gold>i{background:var(--gold)}
.bar.thin{height:4px}
.target-bar{position:relative;height:8px;border-radius:999px;background:var(--sunken);margin:10px 0 6px}
.target-bar>i{position:absolute;top:0;bottom:0;left:0;border-radius:999px;background:var(--brand);transition:width .6s var(--ease)}
.target-bar>b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}
.dots{display:flex;gap:5px;margin-top:10px}
.dots i{flex:1;height:6px;border-radius:3px;background:var(--sunken)}
.dots i.on{background:var(--brand)}

/* ---------- home: live ---------- */
.live{padding:16px 16px 14px}
.live-head{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink-2)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--elec);box-shadow:0 0 0 0 #3F8A2E66;animation:pulse 2s infinite}
.paused .pulse{animation:none;background:var(--faint)}
@keyframes pulse{0%{box-shadow:0 0 0 0 #3F8A2E66}70%{box-shadow:0 0 0 7px #3F8A2E00}100%{box-shadow:0 0 0 0 #3F8A2E00}}
.spike{white-space:nowrap;font-weight:600;color:var(--warn);opacity:0;transition:opacity .3s}
.spike.on{opacity:1}
.live-main{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:6px}
.spark{width:150px;height:52px;flex:none;overflow:visible}
.spark path.line{fill:none;stroke:var(--elec);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.spark path.area{fill:var(--elec-soft);stroke:none}
.spark circle{fill:var(--elec);stroke:var(--surface);stroke-width:2}
.live-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.live-stats div{min-width:0}
.live-stats span{display:block;font-size:12px;color:var(--muted)}
.live-stats b{font-size:15px;font-weight:650}
.live-stats em{font-style:normal;font-size:12px;color:var(--muted)}
.flash{animation:flash .9s var(--ease)}
@keyframes flash{0%{background:var(--brand-soft)}100%{background:transparent}}

/* ---------- home: month ---------- */
.month-progress{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);margin:-2px 0 12px}
.month-progress .bar{flex:1}
.res-row{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:14px 16px}
.res-row+.res-row{border-top:1px solid var(--line)}
.res-row .val{font-size:22px;font-weight:650;letter-spacing:-.01em;line-height:1.15}
.res-row .val small{font-size:13px;color:var(--muted);font-weight:500;margin-left:2px}
.res-row .sub{font-size:12.5px;color:var(--muted)}
.res-row .row-end .delta{display:block;font-size:15px}
.res-row .row-end span{font-size:11.5px;color:var(--muted)}
.compare-line{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border-top:1px solid var(--line);background:#FBFBF9;font-size:13px;color:var(--ink-2)}
.compare-line .i{color:var(--muted);margin-top:1px}
.todo{display:flex;gap:12px;align-items:flex-start}
.todo h3{font-size:15px;font-weight:650}
.todo p{font-size:13.5px;color:var(--ink-2);margin-top:2px}
.todo .btn-row{margin-top:12px}
.prog-row{padding:14px 16px}
.prog-row+.prog-row{border-top:1px solid var(--line)}
.prog-top{display:flex;align-items:center;gap:12px}
.prog-row .bar{margin-top:10px}
.prog-meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:6px}

/* ---------- charts ---------- */
.chart{position:relative;margin-top:12px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis-text{font-size:10px;fill:var(--muted)}
.chart .bar-e{fill:var(--elec)}.chart .bar-w{fill:var(--water)}
.chart .bar-proj{opacity:.28}
.chart .bar-missing{fill:none;stroke:var(--line-2);stroke-dasharray:3 3}
.chart .bar-gray{fill:#C9CFC6}
.chart .typical{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-dasharray:4 4;opacity:.55}
.chart .now-line{stroke:var(--ink);stroke-width:1.5}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit:hover+.hl,.chart .hl.on{opacity:1}
.chart .hl{fill:var(--ink);opacity:0;pointer-events:none}
.chart-tip{position:absolute;z-index:3;pointer-events:none;transform:translate(-50%,-100%);background:var(--ink);color:#fff;font-size:12px;line-height:1.35;padding:6px 9px;border-radius:8px;white-space:nowrap;box-shadow:0 4px 12px #0003}
.chart-tip b{font-weight:650}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px}
.legend i.dash{width:16px;height:0;border-top:1.5px dashed var(--ink);opacity:.6;border-radius:0}
details.table{margin-top:10px;font-size:13px}
details.table summary{cursor:pointer;color:var(--brand);font-weight:600;padding:4px 0}
details.table table{width:100%;border-collapse:collapse;margin-top:6px}
details.table td,details.table th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:right}
details.table td:first-child,details.table th:first-child{text-align:left}
.breakdown{display:grid;gap:10px}
.bd-row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13.5px}
.bd-row .bar{grid-column:1/-1;height:6px}
.headline-stat{display:flex;gap:20px;margin-top:4px}
.headline-stat div span{display:block;font-size:12px;color:var(--muted)}
.headline-stat div b{font-size:20px;font-weight:650}

/* ---------- plan ---------- */
.price-now{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.app-chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-top:12px}
.app-chips button{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 12px;border-radius:999px;border:1.5px solid var(--line-2);background:var(--surface);font-weight:600;font-size:14px}
.app-chips button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.result{margin-top:12px;padding:14px;border-radius:var(--r);background:var(--brand-soft)}
.result h3{font-size:17px;font-weight:650}
.result p{font-size:13.5px;color:var(--ink-2);margin-top:2px}
.rec{padding:16px}
.rec+.rec{border-top:1px solid var(--line)}
.rec h3{font-size:15px;font-weight:650}
.rec p{font-size:13.5px;color:var(--ink-2);margin-top:4px}
.rec .saving{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

/* ---------- goals & rewards ---------- */
.wallet{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:0;padding:0}
.wallet>div{padding:14px 16px}
.wallet>div+div{border-left:1px solid var(--line)}
.wallet span{display:block;font-size:12px;color:var(--muted)}
.wallet b{display:block;font-size:22px;font-weight:650;letter-spacing:-.01em}
.wallet .main b{font-size:28px;color:var(--brand)}
.estimate{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;padding:14px 16px;border-radius:var(--r);background:var(--brand-soft)}
.estimate b{font-size:26px;font-weight:650;color:var(--brand)}
.estimate p{font-size:13px;color:var(--ink-2)}
.ch-card h3{font-size:16px;font-weight:650}
.ch-card p{font-size:13.5px;color:var(--ink-2);margin-top:2px}
.ch-head{display:flex;gap:12px;align-items:flex-start}
.ch-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.faces{display:flex;align-items:center}
.faces .avatar{border:2px solid var(--surface);margin-left:-8px}
.faces .avatar:first-child{margin-left:0}
.faces em{font-style:normal;font-size:12.5px;color:var(--muted);margin-left:6px}
.draw{background:linear-gradient(180deg,#FBF6EA,#FFFFFF 70%)}
.draw h3{font-size:16px;font-weight:650}
.prize-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.code{font:600 20px/1.2 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.06em;padding:14px;border-radius:var(--r);background:var(--sunken);text-align:center;margin-top:12px}

/* ---------- friends ---------- */
.feed-item{display:flex;gap:12px;padding:14px 16px;align-items:flex-start}
.feed-item+.feed-item{border-top:1px solid var(--line)}
.feed-item.new{animation:slidein .5s var(--ease)}
@keyframes slidein{from{background:var(--brand-soft);transform:translateY(-6px);opacity:.3}to{background:transparent;transform:none;opacity:1}}
.feed-text{flex:1;min-width:0;font-size:14.5px;line-height:1.4}
.feed-text b{font-weight:650}
.feed-meta{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:12.5px;color:var(--muted)}
.cheer{flex:none;display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:4px 10px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:13px;font-weight:600;color:var(--ink-2)}
.cheer[aria-pressed="true"]{background:#FDECEA;border-color:#F1C4BC;color:var(--bad)}
.cheer[aria-pressed="true"] .i{fill:currentColor}
.cheer.static{border-color:transparent;background:transparent;cursor:default}
.rank-row{display:grid;grid-template-columns:22px 36px 1fr 74px;gap:10px;align-items:center;padding:10px 16px;min-height:58px;width:100%;border:0;background:none;text-align:left}
.rank-row+.rank-row{border-top:1px solid var(--line)}
.rank-row.me{background:var(--brand-soft)}
.rank-n{font-size:13px;color:var(--muted);font-weight:650;text-align:center}
.rank-bar{height:6px;border-radius:3px;background:var(--sunken);margin-top:6px;position:relative;overflow:hidden}
.rank-bar i{position:absolute;top:0;bottom:0;left:0;border-radius:3px}
.compare-table{width:100%;border-collapse:collapse;font-size:14px;margin-top:14px}
.compare-table th{font-size:12px;color:var(--muted);font-weight:600;text-align:right;padding:6px 0}
.compare-table th:first-child{text-align:left}
.compare-table td{padding:11px 0;border-top:1px solid var(--line);text-align:right;font-weight:600}
.compare-table td:first-child{text-align:left;font-weight:500;color:var(--ink-2)}
.compare-table td.win{color:var(--good)}
.qr{width:132px;height:132px;padding:8px;background:#fff;border:1px solid var(--line);border-radius:12px}
.share{display:flex;gap:16px;align-items:center}

/* ---------- profile ---------- */
.profile-head{display:flex;flex-direction:column;align-items:center;text-align:center;padding:8px 0 4px}
.profile-head h2{font-size:22px;font-weight:650;margin-top:10px}
.profile-head p{font-size:13px;color:var(--muted);margin-top:2px;max-width:300px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow)}
.stats div{background:var(--surface);padding:12px 14px}
.stats span{display:block;font-size:12px;color:var(--muted)}
.stats b{font-size:20px;font-weight:650}
.badges{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0;border:0;background:none;font-size:11px;font-weight:600;line-height:1.2;text-align:center;color:var(--ink-2)}
.medal{position:relative;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:#F6EEDC;color:#8A6418;box-shadow:inset 0 0 0 2px #E7D3A6}
.medal .i{width:22px;height:22px}
.badge.locked .medal{background:var(--sunken);color:var(--faint);box-shadow:inset 0 0 0 2px var(--line-2)}
.badge.locked{color:var(--faint)}
.medal .pin{position:absolute;top:-2px;right:-2px;width:18px;height:18px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;border:2px solid var(--surface)}
.medal .pin .i{width:10px;height:10px;stroke-width:2.5}
.medal.xl{width:84px;height:84px}.medal.xl .i{width:36px;height:36px}
.pinned{display:flex;gap:14px;justify-content:center;margin-top:16px}
.toggle-row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:60px}
.toggle-row+.toggle-row{border-top:1px solid var(--line)}
.ledger-row{display:flex;justify-content:space-between;gap:12px;padding:9px 16px;font-size:13.5px}
.ledger-row+.ledger-row{border-top:1px solid var(--line)}
.ledger-row .neg{color:var(--muted)}

/* ---------- onboarding ---------- */
.ob{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--app)}
.ob-top{flex:none;display:flex;align-items:center;gap:12px;padding:8px 16px 0 12px;min-height:48px}
.ob-steps{flex:1;display:flex;gap:4px}
.ob-steps i{flex:1;height:4px;border-radius:2px;background:var(--line-2)}
.ob-steps i.on{background:var(--brand)}
.ob-body{flex:1;min-height:0;overflow-y:auto;padding:16px 24px 24px}
.ob-body h1{font-size:26px;font-weight:650;letter-spacing:-.02em;line-height:1.15}
.ob-body>p.lead{font-size:15px;color:var(--ink-2);margin-top:8px}
.ob-foot{flex:none;padding:12px 24px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--app)}
.ob-estimate{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink-2);margin-bottom:12px}
.ob-estimate b{color:var(--ink);font-size:14px}
.welcome{flex:1;display:flex;flex-direction:column;padding:28px 28px calc(24px + env(safe-area-inset-bottom))}
.welcome .mark{width:56px;height:56px;color:var(--brand)}
.welcome h1{font-size:34px;font-weight:700;letter-spacing:-.03em;margin-top:28px;line-height:1.05}
.welcome p{font-size:16px;color:var(--ink-2);margin-top:12px;max-width:310px}
.welcome ul{list-style:none;padding:0;margin:28px 0 0;display:grid;gap:14px}
.welcome li{display:flex;gap:12px;align-items:flex-start;font-size:14.5px;color:var(--ink-2)}
.welcome li .chip-icon{width:32px;height:32px}
.welcome .actions{margin-top:auto;display:grid;gap:10px}
.result-hero{text-align:center;padding:20px 0 8px}
.result-hero .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.result-hero .pair div{padding:16px 10px;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow)}
.result-hero .pair b{display:block;font-size:28px;font-weight:650;letter-spacing:-.02em}
.result-hero .pair span{font-size:12.5px;color:var(--muted)}
.consent{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line);font-size:14px}
.consent input{width:22px;height:22px;accent-color:var(--brand);flex:none;margin:1px 0 0}

/* ---------- sheet ---------- */
.sheet-layer{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end;background:#16211B66;animation:fade .2s}
.sheet{max-height:92%;display:flex;flex-direction:column;background:var(--app);border-radius:22px 22px 0 0;animation:up .32s var(--ease)}
.sheet-head{flex:none;display:flex;align-items:center;gap:8px;padding:14px 12px 6px 20px}
.sheet-head h2{flex:1;font-size:18px;font-weight:650}
.sheet-body{flex:1;min-height:0;overflow-y:auto;padding:4px 20px calc(22px + env(safe-area-inset-bottom))}
.sheet-grip{width:36px;height:4px;border-radius:2px;background:var(--line-2);margin:8px auto 0}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{background:#16211B00}}
.alert{display:flex;gap:10px;padding:12px 14px;border-radius:var(--r);font-size:13.5px;margin-top:14px}
.alert.warn{background:var(--warn-soft);color:#5E3A08}
.alert.info{background:var(--sunken);color:var(--ink-2)}
.alert.good{background:var(--good-soft);color:#1D4F31}
.celebrate{text-align:center;padding:12px 0 4px}
.celebrate .burst{width:84px;height:84px;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);animation:pop .5s var(--ease)}
.celebrate .burst .i{width:38px;height:38px}
.celebrate h3{font-size:22px;font-weight:650;margin-top:14px}
.celebrate p{color:var(--ink-2);margin-top:4px}
.celebrate .gain{display:inline-block;font-size:34px;font-weight:700;color:var(--brand);margin-top:10px;animation:rise .7s var(--ease)}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes rise{from{transform:translateY(10px);opacity:0}}

/* ---------- toast ---------- */
.toast{position:absolute;z-index:30;top:48px;left:12px;right:12px;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:#1C2722F2;color:#fff;font-size:14px;line-height:1.35;box-shadow:0 10px 30px #0004;animation:drop .35s var(--ease);cursor:pointer;border:0;text-align:left;width:auto}
.toast .avatar{width:32px;height:32px;font-size:12px}
.toast small{display:block;color:#C7D0CA;font-size:12px}
@keyframes drop{from{transform:translateY(-16px);opacity:0}}
@media(max-width:740px){.toast{top:8px}}

.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>
<style>/* Prototype settings (version switcher). Namespaced so it never collides with a version's own styles. */
.pbx{position:fixed;top:14px;right:16px;z-index:1000;font:500 14px/1.35 ui-sans-serif,-apple-system,"Segoe UI Variable Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#17231d}
.pbx-button{width:40px;height:40px;display:grid;place-items:center;border:1px solid #d6dbd3;border-radius:12px;background:#fffffff2;color:#2b3b33;cursor:pointer;box-shadow:0 1px 2px #17231d14}
.pbx-button:hover{background:#fff;border-color:#b9c2b8}
.pbx-button:focus-visible,.pbx-version:focus-visible,.pbx-action:focus-visible{outline:2px solid #1f4d3a;outline-offset:2px}
.pbx-button svg{width:20px;height:20px}
.pbx-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pbx-menu{position:absolute;top:48px;right:0;width:272px;padding:8px;border:1px solid #dfe3dc;border-radius:14px;background:#fff;box-shadow:0 12px 32px #17231d24}
.pbx-heading{margin:8px 8px 6px;font-size:11px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:#68736c}
.pbx-version,.pbx-action{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:8px;border:0;border-radius:10px;background:none;color:inherit;font:inherit;text-align:left;text-decoration:none;cursor:pointer}
.pbx-version:hover,.pbx-action:hover{background:#f1f3ee}
.pbx-version.is-current{background:#eaf1ec}
.pbx-version svg{width:16px;height:16px;margin-left:auto;color:#1f4d3a;flex:none}
.pbx-tag{flex:none;min-width:30px;padding:3px 0;border-radius:6px;background:#17231d;color:#fff;font-size:12px;font-weight:700;text-align:center}
.pbx-version:not(.is-current) .pbx-tag{background:#e3e7e0;color:#2b3b33}
.pbx-action{flex-direction:column;align-items:flex-start;gap:0}
.pbx-action small{font-size:12px;color:#68736c}
.pbx-foot{margin:8px 8px 4px;padding-top:8px;border-top:1px solid #eceee9;font-size:12px;color:#68736c}
@media(max-width:740px){
  .pbx{top:max(4px,env(safe-area-inset-top));right:8px}
  .pbx-button{width:36px;height:36px;border-radius:10px;box-shadow:none}
  .pbx-menu{width:min(300px,calc(100vw - 16px))}
  [data-pb-version="1"] .presenter-toggle{right:52px}
}
</style>
</head>

<script>/* PowerBuddy V2 domain: household model, typical-usage estimates, simulated meter data,
   prices, goals, challenges, points, rewards, badges and friends. No DOM access. */
const PBD = (() => {
  const VERSION = 2;
  const KEY = 'greenbuddies.powerbuddy.v2';
  const DAY = 864e5;

  /* ---------- small helpers ---------- */
  const pad = (n) => String(n).padStart(2, '0');
  const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const mkey = (d) => ymd(d).slice(0, 7);
  const parseDay = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d || 1); };
  const daysIn = (m) => new Date(+m.slice(0, 4), +m.slice(5, 7), 0).getDate();
  const addMonths = (m, n) => mkey(new Date(+m.slice(0, 4), +m.slice(5, 7) - 1 + n, 1));
  const addDays = (day, n) => { const d = parseDay(day); d.setDate(d.getDate() + n); return ymd(d); };
  const monthIndex = (m) => +m.slice(5, 7) - 1;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const round = (v, d = 0) => { const f = 10 ** d; return Math.round(v * f) / f; };
  const sum = (a) => a.reduce((x, y) => x + y, 0);
  function hash(str) { let h = 2166136261; for (const c of String(str)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
  function rng(seed) {
    let a = typeof seed === 'number' ? seed : hash(seed);
    return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  const wobble = (key, spread) => 1 + (rng(key)() * 2 - 1) * spread;
  const clone = (x) => JSON.parse(JSON.stringify(x));
  const now = (s) => new Date(Date.now() + ((s && s.offset) || 0));
  const today = (s) => ymd(now(s));
  const thisMonth = (s) => mkey(now(s));
  const hourOf = (d) => d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600;
  const monthName = (m, style = 'long') => new Date(+m.slice(0, 4), monthIndex(m), 1).toLocaleString('en-GB', { month: style });

  /* ---------- household catalogue ---------- */
  const REGIONS = [
    { id: 'capital', name: 'Capital Region', area: 'DK2', water: 76 },
    { id: 'zealand', name: 'Zealand', area: 'DK2', water: 72 },
    { id: 'southern', name: 'Southern Denmark', area: 'DK1', water: 68 },
    { id: 'central', name: 'Central Jutland', area: 'DK1', water: 66 },
    { id: 'north', name: 'North Jutland', area: 'DK1', water: 70 }
  ];
  const HOUSING = [
    { id: 'apartment', name: 'Apartment', icon: 'Building2', base: 350 },
    { id: 'terraced', name: 'Terraced house', icon: 'Building', base: 450 },
    { id: 'detached', name: 'Detached house', icon: 'House', base: 550 },
    { id: 'room', name: 'Shared or student room', icon: 'BedSingle', base: 200 }
  ];
  const HEATING = [
    { id: 'district', name: 'District heating', icon: 'Waves', note: 'Heat comes from the city network, not your electricity.' },
    { id: 'heatpump', name: 'Heat pump', icon: 'Fan', note: 'Runs on electricity: roughly 35 kWh per m² a year.' },
    { id: 'electric', name: 'Electric heaters', icon: 'Zap', note: 'Usually the largest electricity use in homes that have it.' },
    { id: 'gas', name: 'Gas or oil boiler', icon: 'Flame', note: 'Only the boiler pump uses electricity.' }
  ];
  const HOT_WATER = [
    { id: 'heating', name: 'From the heating system' },
    { id: 'electric', name: 'Electric water heater' },
    { id: 'heatpump', name: 'Heat pump' }
  ];
  const persons = (p) => p.adults + p.children;
  const washCycles = (p) => 60 + 50 * persons(p);
  const dishCycles = (p) => 100 + 40 * persons(p);
  const APPLIANCES = [
    { id: 'fridge', name: 'Fridge-freezer', icon: 'Refrigerator', kwh: () => 260 },
    { id: 'freezer', name: 'Separate freezer', icon: 'Snowflake', kwh: () => 200 },
    { id: 'washer', name: 'Washing machine', icon: 'WashingMachine', kwh: (p) => washCycles(p) * 0.6, water: (p) => washCycles(p) * 0.05, cycle: { kwh: 0.8, hours: 2, name: 'Laundry', daytime: true } },
    { id: 'dryer', name: 'Tumble dryer', icon: 'Wind', kwh: (p) => washCycles(p) * 0.6 * 1.6, cycle: { kwh: 1.6, hours: 2, name: 'Tumble dryer', daytime: true } },
    { id: 'dishwasher', name: 'Dishwasher', icon: 'Sparkles', kwh: (p) => dishCycles(p) * 0.9, water: (p) => dishCycles(p) * 0.012, cycle: { kwh: 0.9, hours: 3, name: 'Dishwasher' } },
    { id: 'cooking', name: 'Electric hob and oven', icon: 'CookingPot', kwh: (p) => 150 + 90 * persons(p) },
    { id: 'tv', name: 'TV and gaming', icon: 'Tv', kwh: () => 180 },
    { id: 'office', name: 'Home office', icon: 'Laptop', kwh: () => 200 },
    { id: 'ev', name: 'Electric car', icon: 'Car', kwh: () => 2200, cycle: { kwh: 28, hours: 5, name: 'Car charging' } },
    { id: 'bathtub', name: 'Bathtub', icon: 'Bath', water: (p) => 3 + 2 * persons(p) },
    { id: 'garden', name: 'Garden watering', icon: 'Flower2', water: () => 8 }
  ];
  const appliance = (id) => APPLIANCES.find((a) => a.id === id);

  /* Monthly shape of a year (each row sums to 12). Heating follows the cold months much harder. */
  const SEASON_E = [1.17, 1.10, 1.03, 0.95, 0.88, 0.82, 0.80, 0.84, 0.92, 1.03, 1.15, 1.31];
  const SEASON_HEAT = [1.9, 1.7, 1.4, 0.9, 0.4, 0.1, 0.05, 0.05, 0.3, 0.9, 1.4, 1.9].map((v, _, a) => v * 12 / sum(a));
  const SEASON_W = [0.97, 0.95, 0.97, 0.99, 1.02, 1.06, 1.07, 1.06, 1.0, 0.98, 0.96, 0.97];
  /* Daily shape (relative weight per hour). */
  const HOURS_E = [0.55, 0.5, 0.48, 0.47, 0.48, 0.55, 0.8, 1.1, 1.05, 0.9, 0.85, 0.85, 0.9, 0.85, 0.85, 0.95, 1.15, 1.45, 1.55, 1.4, 1.2, 1.0, 0.85, 0.68];
  const HOURS_W = [0.1, 0.05, 0.05, 0.05, 0.1, 0.4, 1.6, 2.2, 1.6, 1.0, 0.8, 0.8, 0.9, 0.7, 0.6, 0.7, 0.9, 1.3, 1.5, 1.3, 1.1, 1.0, 0.8, 0.4];
  const CO2_PER_KWH = 0.12;

  /* ---------- typical usage for a household like this ---------- */
  function estimate(p) {
    const housing = HOUSING.find((h) => h.id === p.housing) || HOUSING[0];
    const has = (id) => p.appliances.includes(id);
    const e = [
      { id: 'base', name: 'Lighting, standby and network', kwh: housing.base + 4 * p.area },
      { id: 'people', name: 'Personal devices and small appliances', kwh: 250 * p.adults + 180 * p.children }
    ];
    for (const a of APPLIANCES) if (a.kwh && has(a.id)) e.push({ id: a.id, name: a.name, kwh: a.kwh(p) });
    if (p.heating === 'heatpump') e.push({ id: 'heating', name: 'Heat pump (heating)', kwh: 35 * p.area, heat: true });
    if (p.heating === 'electric') e.push({ id: 'heating', name: 'Electric heaters', kwh: 90 * p.area, heat: true });
    if (p.heating === 'gas' && p.housing !== 'apartment') e.push({ id: 'heating', name: 'Boiler pump', kwh: 150, heat: true });
    if (p.hotWater === 'electric') e.push({ id: 'hotwater', name: 'Electric water heater', kwh: 700 * persons(p) });
    if (p.hotWater === 'heatpump') e.push({ id: 'hotwater', name: 'Hot water (heat pump)', kwh: 300 * persons(p) });
    const w = [{ id: 'people', name: 'Showers, taps and toilets', m3: 30 * p.adults + 24 * p.children }];
    for (const a of APPLIANCES) if (a.water && has(a.id)) w.push({ id: a.id, name: a.name, m3: a.water(p) });
    if (!has('dishwasher')) w.push({ id: 'handwash', name: 'Washing up by hand', m3: 1.5 * persons(p) });
    e.sort((a, b) => b.kwh - a.kwh); w.sort((a, b) => b.m3 - a.m3);
    return { electricity: { year: sum(e.map((x) => x.kwh)), parts: e }, water: { year: sum(w.map((x) => x.m3)), parts: w } };
  }
  function typicalMonth(p, resource, m) {
    const est = estimate(p), i = monthIndex(m);
    if (resource === 'water') return est.water.year / 12 * SEASON_W[i];
    const heat = sum(est.electricity.parts.filter((x) => x.heat).map((x) => x.kwh));
    return ((est.electricity.year - heat) * SEASON_E[i] + heat * SEASON_HEAT[i]) / 12;
  }
  const seasonFactor = (p, resource, m) => typicalMonth(p, resource, m) / ((resource === 'water' ? estimate(p).water.year : estimate(p).electricity.year) / 12);
  const describeHome = (p) => {
    const h = HOUSING.find((x) => x.id === p.housing), heat = HEATING.find((x) => x.id === p.heating), r = REGIONS.find((x) => x.id === p.region);
    const people = [p.adults && `${p.adults} adult${p.adults > 1 ? 's' : ''}`, p.children && `${p.children} child${p.children > 1 ? 'ren' : ''}`].filter(Boolean).join(', ');

    return `<div class="chart" data-chart><svg viewBox="0 0 ${W} ${height}" role="img" aria-label="${esc(desc || 'Bar chart')}">${g}</svg><div class="chart-tip" hidden></div></div>`;
  }
  function bindCharts(root) {
    for (const chart of $$('[data-chart]', root)) {
      const svg = $('svg', chart), tip = $('.chart-tip', chart);
      const show = (el) => {
        const box = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal, sx = box.width / vb.width;
        const [title, ...rest] = el.dataset.tip.split('|');
        tip.innerHTML = `<b>${esc(title)}</b>${rest.map((r) => `<br>${esc(r)}`).join('')}`;
        tip.hidden = false;
        const x = H.clamp(+el.dataset.x * sx, 60, box.width - 60);
        tip.style.left = x + 'px'; tip.style.top = (+el.dataset.y * sx - 6) + 'px';

      svg.addEventListener('pointerover', (e) => { if (e.target.classList.contains('hit')) show(e.target); });
      svg.addEventListener('click', (e) => { if (e.target.classList.contains('hit')) show(e.target); });
      chart.addEventListener('pointerleave', () => { tip.hidden = true; });
    }
  }

  /* ---------- usage ---------- */
  function viewUsage() {
    const r = ui.usageRes, cls = r === 'water' ? 'bar-w' : 'bar-e', m = P.thisMonth(s), k = r === 'water' ? 'w' : 'e';
    let chart, stats, title;
    if (ui.usageRange === 'month') {
      const dim = H.daysIn(m), t = P.today(s), typ = P.typicalMonth(s.profile, r, m) / dim, bars = [];
      for (let i = 1; i <= dim; i++) {
        const d = `${m}-${String(i).padStart(2, '0')}`, isToday = d === t, past = d < t;
        const v = past ? (s.days[d] ? s.days[d][k] : null) : isToday ? P.todaySoFar(s, r) : null;
        const full = isToday ? P.dayValue(s, r, d) : null;
        bars.push({ value: v, proj: isToday ? full : null, cls, label: [1, 8, 15, 22, 29].includes(i) ? String(i) : '', missing: past && v === null,
          tip: v !== null ? `${dateShort(d)}${isToday ? ' (so far)' : ''}|${fmtRes(r, r === 'water' ? v * 1000 : v)} ${r === 'water' ? 'litres' : 'kWh'}|Typical: ${r === 'water' ? fmt(typ * 1000) + ' litres' : fmt(typ, 1) + ' kWh'}` : null });
      }
      if (r === 'water') bars.forEach((b) => { if (b.value) b.value *= 1000; if (b.proj) b.proj *= 1000; });
      title = `${H.monthName(m)}, day by day`;
      chart = barChart({ bars, typical: r === 'water' ? typ * 1000 : typ, desc: `${resName(r)} per day in ${H.monthName(m)}` });
      const so = P.monthSoFar(s, r), pr = P.projected(s, r);
      stats = [['So far', `${fmtRes(r, so)} ${unit(r)}`], ['Heading for', `${fmtRes(r, pr)} ${unit(r)}`], ['Cost so far', kr(P.cost(s, r, so))]];
    } else {
      const bars = [], typs = [];
      for (let i = 12; i >= 0; i--) {
        const mm = H.addMonths(m, -i), v = s.months[mm] ? s.months[mm][k] : null, isCur = i === 0, typ = P.typicalMonth(s.profile, r, mm);
        typs.push(typ);
        bars.push({ value: isCur ? P.monthSoFar(s, r) : v, proj: isCur ? P.projected(s, r) : null, cls, missing: !isCur && v === null, label: i % 3 === 0 ? H.monthName(mm, 'short') : '',
          tip: isCur ? `${H.monthName(mm)} (so far)|${fmtRes(r, P.monthSoFar(s, r))} ${unit(r)}, heading for ${fmtRes(r, P.projected(s, r))}|Typical: ${fmtRes(r, typ)} ${unit(r)}` : v === null ? `${H.monthName(mm)} ${mm.slice(0, 4)}|Not logged yet` : `${H.monthName(mm)} ${mm.slice(0, 4)}|${fmtRes(r, v)} ${unit(r)} · ${kr(P.cost(s, r, v))}|Typical: ${fmtRes(r, typ)} ${unit(r)}` });
      }
      title = 'The last 12 months';
      chart = barChart({ bars, typical: typs, desc: `${resName(r)} per month for the last 12 months` });
      const logged = bars.slice(0, 12).filter((b) => b.value !== null && !b.missing).map((b) => b.value), total = H.sum(logged);
      stats = [['Last 12 months', `${fmtRes(r, total)} ${unit(r)}`], ['Average month', `${fmtRes(r, logged.length ? total / logged.length : 0)} ${unit(r)}`], ['Cost', kr(P.cost(s, r, total))]];
    }
    const est = P.estimate(s.profile)[r], parts = est.parts.slice(0, 6), maxPart = Math.max(...parts.map((p) => p.kwh || p.m3));
    const breakdown = parts.map((p) => { const v = (p.kwh || p.m3) / 12; return `<div class="bd-row"><span>${esc(p.name)}</span><span class="num muted">${r === 'water' ? fmt(Math.round(v * 100) * 10) + ' L' : fmt(v) + ' kWh'}</span><div class="bar thin ${r === 'water' ? 'water' : 'elec'}"><i style="width:${(p.kwh || p.m3) / maxPart * 100}%"></i></div></div>`; }).join('');
    const months = []; for (let i = 1; i <= 12; i++) months.push(H.addMonths(m, -i));
    const SRC = { bill: 'From bill', manual: 'Entered', meter: 'Meter', sample: 'Sample' };
    const readings = months.map((mm) => { const x = s.months[mm]; return `<div class="row"><div class="row-main"><div class="row-title">${H.monthName(mm)} ${mm.slice(0, 4)}</div><div class="row-sub">${x ? `${fmt(x.e)} kWh · ${fmt(x.w, 1)} m³` : 'Missing'}</div></div>${x ? `<span class="tag">${SRC[x.src] || x.src}</span>` : `<button class="btn secondary small" data-a="reading" data-month="${mm}">Add</button>`}</div>`; }).join('');
    return `<section class="section">${seg('usageRes', [['electricity', 'Electricity'], ['water', 'Water']])}</section>
      <section class="section">${sectionHead(title, '')}${seg('usageRange', [['month', 'This month'], ['year', '12 months']], 'small')}
        <div class="card" style="margin-top:12px">
          <div class="headline-stat">${stats.map(([a, b]) => `<div><span>${a}</span><b class="num">${b}</b></div>`).join('')}</div>
          ${chart}
          <div class="legend"><span><i style="background:var(--${r === 'water' ? 'water' : 'elec'})"></i>Your ${r === 'water' ? 'water' : 'electricity'}</span><span><i class="dash"></i>Homes like yours</span>${ui.usageRange === 'year' ? '<span><i style="border:1px dashed var(--line-2);background:none"></i>Not logged</span>' : ''}</div>
        </div></section>
      <section class="section">${sectionHead('Where it probably goes', 'per month, estimated')}<div class="card"><div class="breakdown">${breakdown}</div>
        <p class="hint" style="margin-top:12px">Based on ${esc(P.describeHome(s.profile))}.</p><button class="link" data-a="household">Edit your household</button></div></section>
      <section class="section">${sectionHead('Months', `<button class="link" data-a="reading">Add a reading</button>`)}<div class="list">${readings}</div></section>`;
  }

  /* ---------- plan ---------- */
  function finishOptions() {
    const n = P.now(s), at = (dayOffset, h) => { const d = new Date(n); d.setDate(d.getDate() + dayOffset); d.setHours(h, 0, 0, 0); return d; };
    const tonight = n.getHours() < 20 ? at(0, 22) : at(1, 22);
    return [['4h', 'Within 4 hours', new Date(n.getTime() + 4 * 36e5)], ['tonight', `By 22:00${n.getHours() < 20 ? '' : ' tomorrow'}`, tonight], ['morning', 'By 07:00 tomorrow', at(1, 7)], ['tomorrow', 'By tomorrow evening', at(1, 22)]];
  }
  function viewPlan() {
    const n = P.now(s), isToday = ui.planDay === 'today', day = isToday ? P.today(s) : H.addDays(P.today(s), 1);

    else {
      const list = P.prices(s, day), green = P.greenHours(list), h = n.getHours(), cheapest = list.indexOf(Math.min(...list));
      const bars = list.map((v, i) => ({ value: v, cls: green.has(i) ? 'bar-e' : 'bar-gray', label: i % 6 === 0 ? String(i).padStart(2, '0') : '', tip: `${String(i).padStart(2, '0')}:00-${String(i + 1).padStart(2, '0')}:00|${fmt(v, 2)} kr/kWh${green.has(i) ? '|Green hour' : ''}` }));
      priceBlock = `<div class="card">
        <div class="price-now">${isToday ? `<span class="big-num num"><span data-live="price">${fmt(list[h], 2)}</span><small>kr/kWh now</small></span><span class="tag ${P.priceLevel(list[h], list)}">${{ low: 'Low', normal: 'Normal', high: 'High' }[P.priceLevel(list[h], list)]}</span>` : `<span class="big-num num">${fmt(Math.min(...list), 2)}<small>kr/kWh lowest</small></span>`}</div>
        <p class="small muted" style="margin-top:4px">Cheapest hour: ${String(cheapest).padStart(2, '0')}:00 at ${fmt(list[cheapest], 2)} kr · most expensive: ${String(list.indexOf(Math.max(...list))).padStart(2, '0')}:00 at ${fmt(Math.max(...list), 2)} kr</p>
        ${barChart({ bars, nowIndex: isToday ? h : null, height: 150, desc: `Electricity price per hour ${isToday ? 'today' : 'tomorrow'}` })}
        <div class="legend"><span><i style="background:var(--elec)"></i>Green hours (8 cheapest)</span><span><i style="background:#C9CFC6"></i>Other hours</span></div>
      </div>`;
    }
    const cyc = P.APPLIANCES.filter((a) => a.cycle && s.profile.appliances.includes(a.id));
    if (!ui.planApp || !cyc.some((a) => a.id === ui.planApp)) ui.planApp = cyc[0] && cyc[0].id;
    let planner;
    if (!cyc.length) planner = `<div class="card"><p class="small muted">Add a washing machine, dishwasher, tumble dryer or electric car to your household to plan runs.</p><button class="link" data-a="household">Edit household</button></div>`;
    else {

      const startDay = best && (H.ymd(new Date(best.start)) === P.today(s) ? 'today' : 'tomorrow');
      planner = `<div class="card">
        <div class="app-chips" role="group" aria-label="Appliance">${cyc.map((x) => `<button data-a="plan-app" data-id="${x.id}" aria-pressed="${x.id === ui.planApp}">${ic(x.icon, 'sm')}${esc(x.cycle.name)}</button>`).join('')}</div>
        <label class="field"><span>Needs to be finished</span><select class="select" data-change="plan-finish">${fo.map(([id, label]) => `<option value="${id}"${id === sel[0] ? ' selected' : ''}>${label}</option>`).join('')}</select></label>
        ${best ? `<div class="result"><h3>Start ${startDay} at ${clock(best.start)}</h3><p>${a.cycle.hours} h, about ${fmt(best.kwh, 1)} kWh. Costs about ${kr(best.cost, 2)}${best.saving > 0.05 ? `, <b>${kr(best.saving, 2)} less</b> than starting at the next full hour` : ', the same as starting now'}.${best.green ? ' Runs in green hours.' : ''}</p>
          <div class="btn-row"><button class="btn primary" data-a="plan-make" data-start="${best.start}">Plan this run</button></div></div>`
          : `<div class="alert info">${ic('Info', 'sm')}<span>No full run fits before then${a.cycle.daytime ? ' between 07:00 and 22:00' : ''}. Try a later finish time.</span></div>`}

      <div class="saving"><span class="tag brand">≈ ${kr(r.saveKr)} / month</span>${r.saveE ? `<span class="tag">${fmt(r.saveE, r.saveE < 10 ? 1 : 0)} kWh</span>` : ''}${r.saveW ? `<span class="tag">${fmt(Math.round(r.saveW * 100) * 10)} L</span>` : ''}${r.costOnly ? '<span class="tag">Saves money, not energy</span>' : ''}</div>

  /* ---------- goals ---------- */

    const wallet = `<section class="section"><div class="card wallet"><div class="main"><span>Available</span><b class="num">${fmt(P.available(s))}</b></div><div><span>Earned</span><b class="num">${fmt(P.lifetime(s))}</b></div><div><span>Draw tickets</span><b class="num">${tickets}</b></div></div></section>`;

      const active = s.goals.filter((g) => g.status === 'active'), past = s.goals.filter((g) => g.status !== 'active');
      body = `<section class="section">${sectionHead('Active', `<button class="link" data-a="goal">${ic('Plus', 'sm')}New goal</button>`)}
        ${active.length ? `<div class="list">${active.map(goalRow).join('')}</div>` : `<div class="card empty">No goal running. Set one for ${H.monthName(m)}: pick how much to cut, and we'll show what it's worth.<div class="btn-row" style="justify-content:center"><button class="btn primary small" data-a="goal" style="flex:none">New goal</button></div></div>`}
        <p class="hint">Goals are measured against your usual: your last three logged months, adjusted for the season.</p></section>

        <p class="hint">${ic('Ticket', 'xs')} Monthly challenges also give a ticket for the Green draw. Joining is free and gives no points by itself.</p></section>

    } else {

          ${last ? `<p class="small" style="margin-top:12px">${ic('Trophy', 'xs')} ${H.monthName(last.month)}: <b>${esc(P.friendName(last.winner))}</b> won ${esc(last.prize.toLowerCase())}.</p>` : ''}</div></section>
        <section class="section">${sectionHead('Partner rewards', `${fmt(P.available(s))} pts to spend`)}
          <p class="hint" style="margin:-4px 0 10px">Every partner has to cut consumption, make things last, or be a lower-impact swap. No fast fashion, no gadgets.</p>

        ${s.redemptions.length ? `<section class="section">${sectionHead('Your codes')}<div class="list">${s.redemptions.map((v) => { const r = P.REWARDS.find((x) => x.id === v.rewardId); return `<button class="row" data-a="reward" data-id="${r.id}"><div class="row-main"><div class="row-title">${esc(r.name)}</div><div class="row-sub">${esc(r.partner)} · ${dateShort(v.at)}</div></div><code class="num" style="font-size:13px">${esc(v.code)}</code></button>`; }).join('')}</div></section>` : ''}`;

  /* ---------- live data ---------- */

        <div class="row"><div class="row-main"><div class="row-title">How it's measured</div><div class="row-sub">${esc(t.how)}</div></div>${ic('Gauge')}</div>

    reward(sh) {
      const r = P.REWARDS.find((x) => x.id === sh.id), v = s.redemptions.find((x) => x.rewardId === r.id), short = r.cost - P.available(s);
      return [esc(r.name), `<div class="ch-head"><span class="chip-icon brand">${ic(r.icon)}</span><div><div class="row-title">${esc(r.partner)}</div><span class="tag brand" style="margin-top:4px">${P.PARTNER_TEST[r.cat]}</span></div></div>
        <div class="alert info">${ic('Leaf', 'sm')}<span><b>Why this partner:</b> ${esc(r.why)}</span></div>
        ${v ? `<p class="small muted" style="margin-top:14px">Your code, redeemed ${dateShort(v.at)}. Show it in the shop or enter it online. It works once.</p><div class="code">${esc(v.code)}</div><div class="btn-row"><button class="btn secondary" data-a="copy" data-text="${esc(v.code)}">${ic('Copy', 'sm')}Copy code</button></div>`
          : `<div class="btn-row"><button class="btn primary" data-a="redeem" data-id="${r.id}"${short > 0 ? ' disabled' : ''}>${short > 0 ? `${short} more points needed` : `Redeem for ${r.cost} points`}</button></div><p class="hint" style="text-align:center">Codes are single-use and tied to your account.</p>`}`];
    },
    friend(sh) {
      const f = P.person(sh.id), m = P.thisMonth(s), me = { e: P.change(s, 'electricity', m), w: P.change(s, 'water', m), streak: P.loggedStreak(s, H.addMonths(m, -1)) || P.loggedStreak(s, H.addMonths(m, -2)), pts: P.lifetime(s), done: challengesDone(), badges: Object.keys(s.badges).length };
      const row = (label, a, b, lowerWins, f2 = (x) => fmt(x)) => `<tr><td>${label}</td><td class="num ${(lowerWins ? a < b : a > b) ? 'win' : ''}">${f2(a)}</td><td class="num ${(lowerWins ? b < a : b > a) ? 'win' : ''}">${f2(b)}</td></tr>`;
      const exact = s.privacy.exact && f.share;
      const isFriend = P.mutualFriends(s).some((x) => x.id === f.id);
      return [`You and ${esc(f.name)}`, `<div class="ch-head">${avatar(f.id, 'lg')}<div><div class="row-title" style="font-size:18px">${esc(f.name)}</div><p class="small muted">${esc(f.home)} · ${esc(f.city)}</p><div class="faces" style="margin-top:8px">${f.badges.slice(0, 5).map((id) => { const b = P.BADGES.find((x) => x.id === id); return `<span class="medal" style="width:28px;height:28px;margin-right:4px" title="${esc(b.name)}">${ic(b.icon, 'xs')}</span>`; }).join('')}</div></div></div>
        <table class="compare-table"><thead><tr><th>This month</th><th>You</th><th>${esc(f.name)}</th></tr></thead><tbody>
        ${row('Electricity vs usual', H.round(me.e, 1), f.e, true, (x) => signed(x, 1))}
        ${row('Water vs usual', H.round(me.w, 1), f.w, true, (x) => signed(x, 1))}
        ${row('Logging streak', me.streak, f.streak, false, (x) => `${x} mo`)}
        ${row('Challenges done', me.done, f.done, false)}
        ${row('Points earned', me.pts, f.pts, false)}
        ${row('Badges', me.badges, f.badges.length, false)}
        ${exact ? row('kWh per person', H.round(P.projected(s, 'electricity') / P.persons(s.profile)), f.perE, true) : ''}
        </tbody></table>
        ${exact ? '' : `<div class="alert info">${ic('EyeOff', 'sm')}<span>Exact usage is hidden. It's only shown when you both turn on <b>Share exact usage</b>${f.share ? ` (${esc(f.name)} has)` : ''}.</span></div>`}
        ${isFriend ? `<div class="btn-row"><button class="btn secondary" data-a="league-with" data-id="${f.id}">${ic('Users', 'sm')}Start a Friends' league</button></div>` : ''}`];
    },
    addFriend(sh) {
      return ['Add a friend', `<form data-form="add-friend" novalidate><p class="small muted">Ask your friend for their code. It's on their profile.</p>
        ${field('Friend code', `<input class="input" name="code" placeholder="NAME-1234" autocapitalize="characters" autocomplete="off" value="${esc(sh.value || '')}" aria-invalid="${!!sh.error}">`, sh.error)}
        <div class="btn-row"><button class="btn primary" type="submit">Send request</button></div>
        <p class="hint">Prototype: try <b>SIGNE-3307</b> or <b>JONAS-5120</b>.</p></form>`];
    },
    share() {
      return ['Your code', `<div class="share" style="flex-direction:column;text-align:center">${qr(s.profile.code)}<div><div class="num" style="font-size:24px;font-weight:700;letter-spacing:.05em">${esc(s.profile.code)}</div><p class="hint">Friends scan this or type the code in <b>Add a friend</b>. Mock code for the prototype.</p></div></div>
        <div class="btn-row"><button class="btn primary" data-a="copy-code">${ic('Copy', 'sm')}Copy code</button><button class="btn secondary" data-a="copy" data-text="https://powerbuddy.example/add/${esc(s.profile.code)}">${ic('Share2', 'sm')}Copy link</button></div>`];
    },
    badge(sh) {
      const b = P.BADGES.find((x) => x.id === sh.id), got = s.badges[b.id];
      const friendsWith = P.mutualFriends(s).filter((f) => f.badges.includes(b.id));
      return [esc(b.name), `<div class="celebrate"><span class="medal xl" style="margin:0 auto;${got ? '' : 'background:var(--sunken);color:var(--faint);box-shadow:inset 0 0 0 2px var(--line-2)'}">${ic(got ? b.icon : 'Lock')}</span>
        <p style="margin-top:14px">${esc(b.how)}</p><p class="small muted" style="margin-top:6px">${got ? `Earned ${dateShort(got.at)}` : 'Not earned yet'}${friendsWith.length ? ` · ${friendsWith.length} of your friends have it` : ''}</p></div>
        ${got ? `<div class="btn-row"><button class="btn ${got.pinned ? 'secondary' : 'primary'}" data-a="pin" data-id="${b.id}">${ic('Pin', 'sm')}${got.pinned ? 'Unpin from profile' : 'Pin to profile'}</button></div>` : ''}

      const d = sh.d;
      return ['Your household', `<form data-form="household">${householdFields(d)}<p class="hint">Changing this updates the "homes like yours" estimate. Your logged months stay as they are.</p><div class="btn-row"><button class="btn primary" type="submit">Save</button></div></form>`];
    },
    celebrate(sh) {
      const main = sh.items.find((x) => x.type === 'challenge' || x.type === 'goal') || sh.items[0];
      const badges = sh.items.filter((x) => x.type === 'badge'), pts = H.sum(sh.items.map((x) => x.points || 0)), ticket = sh.items.some((x) => x.ticket);
      const title = main.type === 'badge' ? 'New badge' : main.type === 'goal' ? 'Goal reached' : 'Challenge complete';
      return [title, `<div class="celebrate"><div class="burst">${ic(main.type === 'badge' ? P.BADGES.find((b) => b.id === main.id).icon : main.type === 'goal' ? 'Target' : 'Trophy')}</div>
        <h3>${esc(main.title)}</h3>${pts ? `<div class="gain">+${pts}</div><p>points</p>` : ''}${ticket ? `<p style="margin-top:8px">${ic('Ticket', 'sm')} You're in the Green draw</p>` : ''}
        ${badges.length && main.type !== 'badge' ? `<p style="margin-top:8px">${ic('Award', 'sm')} New badge: ${badges.map((b) => esc(b.title)).join(', ')}</p>` : badges.length > 1 ? `<p style="margin-top:8px">Also: ${badges.slice(1).map((b) => esc(b.title)).join(', ')}</p>` : ''}
        <p class="small muted" style="margin-top:12px">${s.privacy.feed ? 'Your friends will see this in their feed.' : 'Your activity is hidden from friends.'}</p></div>
        <div class="btn-row"><button class="btn primary" data-a="close">Done</button></div>`];
    }
  };
  function qr(code) {
    const n = 21, r = H.rng('qr' + code), cells = [];
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      const inF = [[0, 0], [n - 7, 0], [0, n - 7]].find(([fx, fy]) => x >= fx && x < fx + 7 && y >= fy && y < fy + 7);
      let on;
      if (inF) { const dx = x - inF[0], dy = y - inF[1]; on = dx === 0 || dx === 6 || dy === 0 || dy === 6 || (dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4); }
      else on = r() < 0.48;
      if (on) cells.push(`<rect x="${x}" y="${y}" width="1.02" height="1.02"/>`);
    }
    return `<svg class="qr" viewBox="-1 -1 ${n + 2} ${n + 2}" role="img" aria-label="Mock QR code for ${esc(code)}" fill="#16211B">${cells.join('')}</svg>`;
  }
  function updateGoalSheet() {
    const sh = ui.sheet; if (!sh || sh.type !== 'goal') return;
    const r = sh.resource || 'electricity', target = sh.target || 5, months = sh.months || 1, m = P.thisMonth(s);
    const eff = P.efficient(s, r), pts = P.goalPoints({ target, months, resource: r, efficient: eff });

    set('target', `${target}%`); set('points', `≈ ${pts} pts`);
    set('why', `8 × ${target}% × ${months} month${months > 1 ? 's' : ''}${r === 'both' ? ' × 1.5 for both' : ''}${eff ? ' × 1.25 because you already use less than similar homes' : ''}`);
    const res = r === 'both' ? ['electricity', 'water'] : [r];
    set('baseline', res.map((x) => { const u = P.usual(s, x, m), pr = P.projected(s, x); return `<div style="margin-top:4px">${ic(x === 'water' ? 'Droplet' : 'Zap', 'xs')} Usual ${H.monthName(m)}: <b>${fmtRes(x, u)} ${unit(x)}</b> → aim for <b>${fmtRes(x, u * (1 - target / 100))} ${unit(x)}</b>. Heading for ${fmtRes(x, pr)}.</div>`; }).join(''));
    set('warn', target > 15 ? `<div class="alert warn">${ic('CircleAlert', 'sm')}<span>Over 15% is a big change in one go. It's worth more points, but a smaller step you keep is better than a big one you don't.</span></div>` : '');
  }

  /* ---------- household fields (onboarding + edit) ---------- */

      home: `<div class="choice-grid">${P.HOUSING.map((h) => `<button type="button" class="choice" data-a="choose" data-field="housing" data-val="${h.id}" aria-pressed="${d.housing === h.id}">${ic(h.icon)}${h.name}</button>`).join('')}</div>

      heat: `<div class="choice-grid">${P.HEATING.map((h) => `<button type="button" class="choice" data-a="choose" data-field="heating" data-val="${h.id}" aria-pressed="${d.heating === h.id}">${ic(h.icon)}${h.name}<small>${h.note}</small></button>`).join('')}</div>
        <div class="field"><span>Hot water comes from</span></div><div class="seg" role="group" style="flex-wrap:wrap">${P.HOT_WATER.map((h) => `<button type="button" data-a="choose" data-field="hotWater" data-val="${h.id}" aria-pressed="${d.hotWater === h.id}">${h.name.replace('From the heating system', 'Heating system').replace('Electric water heater', 'Electric heater')}</button>`).join('')}</div>`,
      appliances: `<div class="check-list">${P.APPLIANCES.map((a) => `<button type="button" class="choice" role="checkbox" data-a="toggle-app" data-id="${a.id}" aria-checked="${d.appliances.includes(a.id)}">${ic(a.icon)}${a.name}</button>`).join('')}</div>`

  }

  /* ---------- onboarding ---------- */

  const MARK = `<svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M5 15.5 16 6l11 9.5V26a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M9.5 19h3.5l2-4 2.5 7 2-3h3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  function obProfile(d) { return { name: d.name.trim() || 'You', region: d.region, housing: d.housing, area: +d.area, adults: +d.adults, children: +d.children, heating: d.heating, hotWater: d.hotWater, appliances: d.appliances, payment: d.payment }; }

  }

      <ul><li><span class="chip-icon elec">${ic('Gauge', 'sm')}</span>See usage and cost, month by month</li><li><span class="chip-icon water">${ic('Clock', 'sm')}</span>Run the washing machine when power is cheapest</li><li><span class="chip-icon brand">${ic('Users', 'sm')}</span>Set goals, join challenges, earn rewards from sustainable partners</li></ul>

      place: `<h1>Where do you live?</h1><p class="lead">PowerBuddy covers Denmark. Prices and water rates depend on where you are.</p>${field('Country', '<select class="select" disabled><option>Denmark</option></select>')}${householdFields(d, 'place')}`,
      home: `<h1>Tell us about your home</h1><p class="lead">This is what we compare you with. A family house and a one-room flat use very different amounts.</p>${householdFields(d, 'home')}${e.people ? `<span class="field-error">${esc(e.people)}</span>` : ''}`,

        <div class="choice-grid"><button type="button" class="choice" data-a="choose" data-field="payment" data-val="bills" aria-pressed="${d.payment === 'bills'}">${ic('Receipt')}I get my own bills</button><button type="button" class="choice" data-a="choose" data-field="payment" data-val="rent" aria-pressed="${d.payment === 'rent'}">${ic('House')}It's in my rent</button></div>
        ${d.payment === 'bills' ? `<p class="small" style="margin-top:18px;font-weight:600">Your latest month (optional)</p>${field('Electricity', `<div class="input-unit"><input class="input" data-input="ob" data-field="billE" inputmode="decimal" value="${esc(d.billE)}" aria-invalid="${!!e.billE}"><b>kWh</b></div>`, e.billE)}${field('Water', `<div class="input-unit"><input class="input" data-input="ob" data-field="billW" inputmode="decimal" value="${esc(d.billW)}" aria-invalid="${!!e.billW}"><b>m³</b></div>`, e.billW)}` : ''}
        <label class="consent" style="border:0;margin-top:10px"><input type="checkbox" data-check="sample"${d.sample ? ' checked' : ''}><span>Fill the last 12 months with sample data<br><span class="muted small">Prototype only, so the charts have something to show.</span></span></label>`,

        <div class="pair"><div><b class="num">${fmt(P.typicalMonth(p, 'electricity', m))}</b><span>kWh in ${H.monthName(m)}</span></div><div><b class="num">${fmt(P.typicalMonth(p, 'water', m), 1)}</b><span>m³ water in ${H.monthName(m)}</span></div></div></div>
        <p class="small" style="font-weight:600;margin-top:18px">Where electricity usually goes</p><div class="breakdown" style="margin-top:10px">${est.electricity.parts.slice(0, 4).map((x) => `<div class="bd-row"><span>${esc(x.name)}</span><span class="num muted">${fmt(x.kwh / est.electricity.year * 100)}%</span><div class="bar thin elec"><i style="width:${x.kwh / est.electricity.parts[0].kwh * 100}%"></i></div></div>`).join('')}</div>

      <div class="ob-body" id="ob-body">${bodies[step]}</div>

  function focusOb() { const el = $('#ob-body input:not([type=checkbox]):not([type=range])'); if (el && ui.ob && OB_STEPS[ui.ob.step] === 'name') el.focus({ preventScroll: true }); }
